<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Questions | Online Exam System</title>

    <!-- Global Styles -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <!-- Add Questions Styles -->
    <link rel="stylesheet" href="../../assets/css/teacher.css">
    <link <link rel="stylesheet" href="../../assets/css/add-questions.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <h1>Add Questions</h1>
        </div>
        <div class="nav-right">
            <button class="btn btn-outline" id="finishBtn"">Finish</button>
            <button id=" logoutBtn" class="btn btn-outline">Logout</button>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="dashboard-container">
        <h2>Add a New Question</h2>
        <form id="questionForm">

            <div class="form-group">
                <label>Question Text</label>
                <input type="text" id="questionText" placeholder="Enter your question" required />
            </div>

            <div class="form-group">
                <label>Question Type</label>
                <select id="questionType">
                    <option value="multiple_choice">Multiple Choice</option>
                    <option value="true_false">True / False</option>
                </select>
            </div>

            <div id="optionsContainer">
                <!-- Options inputs will be rendered dynamically -->
            </div>

            <button type="submit" class="btn btn-primary full-width">
                Add Question
            </button>
        </form>

        <p id="successMessage" style="color: green; margin-top: 15px;"></p>
        <p id="errorMessage" style="color: red; margin-top: 15px;"></p>
    </div>

    <script src="../../assets/js/add-questions.js"></script>
</body>

</html>
